<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk · 16 Tenses</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0e1525; --card:#161f33; --field:#0f1828; --border:#26324d;
    --accent:#5b7cfa; --accent2:#8b9dff; --txt:#eef1f8; --muted:#8b96b0;
    --err:#ff6b6b; --ok:#3ddc97;
  }
  body{min-height:100vh;background:radial-gradient(1200px 600px at 70% -10%,#1d2a4d,transparent),var(--bg);
    color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{position:relative;width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.45);}
  /* Rumah toggle tema, khusus halaman login: menempel di pojok kanan atas kartu. */
  .theme-slot{position:absolute;top:16px;right:16px;z-index:2;}
  /* Ubin ikon: satu warna di atas permukaan polos, bukan gradasi. */
  .logo{width:48px;height:48px;border-radius:14px;background:var(--field);border:1px solid var(--border);color:var(--accent2);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .logo svg{width:24px;height:24px;display:block;}
  h1{font-size:23px;font-weight:700;margin-bottom:6px;}
  .sub{font-size:14px;color:var(--muted);margin-bottom:26px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:500;}
  .input-wrap{position:relative;}
  input{width:100%;background:var(--field);border:1px solid var(--border);border-radius:11px;padding:13px 15px;color:var(--txt);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,124,250,.18);}
  input::placeholder{color:#5a647d;}
  .toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px;}
  .btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:filter .15s,transform .05s;}
  .btn:hover{filter:brightness(1.08);} .btn:active{transform:scale(.99);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .msg{font-size:13px;border-radius:10px;padding:11px 14px;margin-bottom:16px;display:none;}
  .msg.err{display:block;background:rgba(255,107,107,.12);color:var(--err);border:1px solid rgba(255,107,107,.3);}
  .msg.ok{display:block;background:rgba(61,220,151,.12);color:var(--ok);border:1px solid rgba(61,220,151,.3);}
  .switch{text-align:center;font-size:14px;color:var(--muted);margin-top:22px;}
  .switch a{color:var(--accent2);font-weight:600;text-decoration:none;cursor:pointer;}
  .switch a:hover{text-decoration:underline;}
  .divider{display:flex;align-items:center;gap:12px;margin:20px 0;font-size:12px;color:var(--muted);}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
  .btn-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid var(--border);border-radius:11px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;transition:filter .15s,transform .05s;}
  .btn-google:hover{filter:brightness(.96);} .btn-google:active{transform:scale(.99);}
  .btn-google:disabled{opacity:.6;cursor:not-allowed;}
  .hint{font-size:11.5px;color:#697390;margin-top:6px;}
  .hint.bad{color:var(--err);} .hint.good{color:var(--ok);}
</style>
</head>
<body>
  <div class="card">
    <div class="theme-slot" data-theme-slot></div>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
      </svg>
    </div>
    <h1 id="title">Selamat datang kembali</h1>
    <p class="sub" id="subtitle">Masuk untuk membuka materi 16 Tenses.</p>

    <div class="msg" id="msg"></div>

    <form id="form" autocomplete="off">
      <div class="field" id="nameField" style="display:none;">
        <label for="name">Nama</label>
        <input type="text" id="name" placeholder="Nama lengkap">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="kamu@email.com" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="toggle-eye" id="eye">Lihat</button>
        </div>
        <div class="hint" id="pwHint" style="display:none;">Minimal 6 karakter — bebas huruf besar, huruf kecil, angka, atau simbol.</div>
      </div>
      <div class="field" id="confirmField" style="display:none;">
        <label for="confirm">Konfirmasi Password</label>
        <div class="input-wrap">
          <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="toggle-eye" id="eyeConfirm">Lihat</button>
        </div>
        <div class="hint" id="confirmHint"></div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Masuk</button>
    </form>

    <div class="divider"><span>atau</span></div>

    <button type="button" class="btn-google" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Masuk dengan Google
    </button>

    <p class="switch" id="switch">Belum punya akun? <a id="switchLink">Daftar</a></p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
<script>
  const $ = (id)=>document.getElementById(id);
  const msg = $('msg');
  function showMsg(t,type){ msg.textContent=t; msg.className='msg '+type; }
  function clearMsg(){ msg.className='msg'; msg.textContent=''; }

  // Cek konfigurasi
  if (typeof SUPABASE_URL === 'undefined' || SUPABASE_URL.indexOf('GANTI_') === 0) {
    showMsg('config.js belum diisi. Isi SUPABASE_URL & SUPABASE_ANON_KEY dulu.', 'err');
  }
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Sudah login? langsung ke materi.
  client.auth.getSession().then(({data})=>{ if(data.session){ location.replace('home.html'); } });

  // Tujuan setelah berhasil masuk / setelah link verifikasi email diklik.
  const HOME_URL = window.location.origin
    + window.location.pathname.replace(/index\.html$/, '') + 'home.html';

  // Aturan password: panjang saja, tanpa syarat jenis karakter.
  const MIN_PW = 6;

  let mode='login';
  function setMode(m){
    mode=m; clearMsg();
    const reg = m==='register';
    $('nameField').style.display = reg ? 'block':'none';
    $('confirmField').style.display = reg ? 'block':'none';
    $('pwHint').style.display = reg ? 'block':'none';
    if(!reg){ $('confirm').value=''; }
    checkMatch();
    $('title').textContent = reg ? 'Buat akun baru' : 'Selamat datang kembali';
    $('subtitle').textContent = reg ? 'Daftar untuk membuka materi 16 Tenses.' : 'Masuk untuk membuka materi 16 Tenses.';
    $('submitBtn').textContent = reg ? 'Daftar' : 'Masuk';
    $('password').setAttribute('autocomplete', reg ? 'new-password':'current-password');
    $('switch').innerHTML = reg
      ? 'Sudah punya akun? <a id="switchLink">Masuk</a>'
      : 'Belum punya akun? <a id="switchLink">Daftar</a>';
    $('switchLink').onclick = ()=> setMode(reg ? 'login' : 'register');
  }
  $('switchLink').onclick = ()=> setMode('register');

  function makeEye(btnId, inputId){
    $(btnId).onclick = ()=>{
      const p=$(inputId); const show=p.type==='password';
      p.type = show ? 'text':'password';
      $(btnId).textContent = show ? 'Sembunyikan':'Lihat';
    };
  }
  makeEye('eye','password');
  makeEye('eyeConfirm','confirm');

  // Beri tahu kecocokan password sambil diketik, jangan tunggu sampai submit.
  function checkMatch(){
    const hint=$('confirmHint');
    if(mode!=='register'){ hint.textContent=''; hint.className='hint'; return; }
    const pw=$('password').value, cf=$('confirm').value;
    if(!cf){ hint.textContent=''; hint.className='hint'; return; }
    const same = pw===cf;
    hint.textContent = same ? 'Password cocok.' : 'Password belum sama.';
    hint.className = 'hint ' + (same ? 'good':'bad');
  }
  $('password').addEventListener('input', checkMatch);
  $('confirm').addEventListener('input', checkMatch);

  $('form').addEventListener('submit', async (e)=>{
    e.preventDefault(); clearMsg();
    const name=$('name').value.trim();
    const email=$('email').value.trim().toLowerCase();
    const password=$('password').value;
    const confirm=$('confirm').value;
    const btn=$('submitBtn');

    if(!email || !password) return showMsg('Email dan password wajib diisi.','err');
    if(mode==='register'){
      if(!name) return showMsg('Nama wajib diisi.','err');
      if(password.length<MIN_PW) return showMsg('Password minimal '+MIN_PW+' karakter.','err');
      if(!confirm) return showMsg('Konfirmasi password wajib diisi.','err');
      if(password!==confirm) return showMsg('Password dan konfirmasi password belum sama.','err');
    }

    btn.disabled=true; btn.textContent='Memproses...';
    try{
      if(mode==='register'){
        const { data, error } = await client.auth.signUp({
          email, password,
          // Link di email verifikasi mendarat langsung di home, bukan kembali ke login.
          options:{ data:{ name }, emailRedirectTo: HOME_URL }
        });
        if(error) throw error;
        // Kalau email sudah terdaftar, Supabase sengaja membalas seolah-olah
        // berhasil — lengkap dengan confirmation_sent_at palsu — supaya orang
        // luar tidak bisa menebak email mana yang punya akun. Satu-satunya
        // penanda jujurnya: identities kosong. Tanpa cek ini, pengguna lama
        // disuruh menunggu email verifikasi yang tidak pernah dikirim.
        if(data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){
          setMode('login');            // setMode membersihkan pesan, jadi panggil dulu
          $('email').value = email;
          return showMsg('Email ini sudah terdaftar. Silakan Masuk dengan password kamu.','err');
        }
        if(data.session){
          showMsg('Akun berhasil dibuat! Mengarahkan...','ok');
          setTimeout(()=> location.replace('home.html'), 700);
        } else {
          // setMode membersihkan pesan, jadi tampilkan pesannya sesudah pindah mode.
          setMode('login');
          showMsg('Akun dibuat. Kami kirim link verifikasi ke ' + email +
                  '. Buka email itu dan klik link-nya — kamu akan langsung masuk ke materi.','ok');
        }
      } else {
        const { error } = await client.auth.signInWithPassword({ email, password });
        if(error) throw error;
        showMsg('Berhasil masuk! Mengarahkan...','ok');
        setTimeout(()=> location.replace('home.html'), 500);
      }
    }catch(err){
      const m = (err && err.message) ? err.message : 'Terjadi kesalahan.';
      // Pesan ramah untuk error umum
      if(/invalid login/i.test(m)) showMsg('Email atau password salah.','err');
      else if(/already registered/i.test(m)) showMsg('Email sudah terdaftar. Silakan Masuk.','err');
      else showMsg(m,'err');
    }finally{
      btn.disabled=false; btn.textContent = mode==='register' ? 'Daftar':'Masuk';
    }
  });

  $('googleBtn').addEventListener('click', async ()=>{
    clearMsg();
    const btn=$('googleBtn');
    btn.disabled=true;
    const { error } = await client.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: HOME_URL }
    });
    if(error){
      showMsg(error.message || 'Gagal masuk dengan Google.', 'err');
      btn.disabled=false;
    }
    // Kalau sukses, browser akan redirect ke Google lalu balik lagi (loading state biarkan aktif).
  });

  setMode('login');
</script>
</body>
</html>
