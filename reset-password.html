<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Baru — Tenses.id</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#0e1525; --card:#161f33; --field:#0f1828; --border:#26324d;
    --accent:#5b7cfa; --accent2:#8b9dff; --txt:#eef1f8; --muted:#8b96b0;
    --err:#ff6b6b; --ok:#3ddc97;
  }
  body{min-height:100vh;background:radial-gradient(1200px 600px at 70% -10%,#1d2a4d,transparent),var(--bg);
    color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;}
  .card{position:relative;width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 30px;box-shadow:0 30px 80px rgba(0,0,0,.45);}
  .theme-slot{position:absolute;top:16px;right:16px;z-index:2;}
  .logo{width:48px;height:48px;border-radius:14px;background:var(--field);border:1px solid var(--border);color:var(--accent2);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .logo svg{width:24px;height:24px;display:block;}
  h1{font-size:23px;font-weight:700;margin-bottom:6px;}
  .sub{font-size:14px;color:var(--muted);margin-bottom:26px;}
  .field{margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px;font-weight:500;}
  .input-wrap{position:relative;}
  input{width:100%;background:var(--field);border:1px solid var(--border);border-radius:11px;padding:13px 15px;color:var(--txt);font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,124,250,.18);}
  input::placeholder{color:#5a647d;}
  .toggle-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px;}
  .btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:11px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:filter .15s,transform .05s;}
  .btn:hover{filter:brightness(1.08);} .btn:active{transform:scale(.99);}
  .btn:disabled{opacity:.6;cursor:not-allowed;}
  .msg{font-size:13px;border-radius:10px;padding:11px 14px;margin-bottom:16px;display:none;}
  .msg.err{display:block;background:rgba(255,107,107,.12);color:var(--err);border:1px solid rgba(255,107,107,.3);}
  .msg.ok{display:block;background:rgba(61,220,151,.12);color:var(--ok);border:1px solid rgba(61,220,151,.3);}
  .hint{font-size:11.5px;color:#697390;margin-top:6px;}
  .hint.bad{color:var(--err);} .hint.good{color:var(--ok);}
  .switch{text-align:center;font-size:14px;color:var(--muted);margin-top:22px;}
  .switch a{color:var(--accent2);font-weight:600;text-decoration:none;cursor:pointer;}
  .switch a:hover{text-decoration:underline;}
</style>
</head>
<body>
  <div class="card">
    <div class="theme-slot" data-theme-slot></div>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/>
        <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
      </svg>
    </div>
    <h1 id="title">Buat password baru</h1>
    <p class="sub" id="subtitle">Memeriksa link kamu...</p>

    <div class="msg" id="msg"></div>

    <form id="form" autocomplete="off" style="display:none;">
      <div class="field">
        <label for="password">Password baru</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="toggle-eye" id="eye">Lihat</button>
        </div>
        <div class="hint">Minimal 6 karakter — bebas huruf besar, huruf kecil, angka, atau simbol.</div>
      </div>
      <div class="field">
        <label for="confirm">Konfirmasi password baru</label>
        <div class="input-wrap">
          <input type="password" id="confirm" placeholder="••••••••" autocomplete="new-password">
          <button type="button" class="toggle-eye" id="eyeConfirm">Lihat</button>
        </div>
        <div class="hint" id="confirmHint"></div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Simpan password baru</button>
    </form>

    <p class="switch" id="back" style="display:none;"><a href="index.html">Kembali ke halaman Masuk</a></p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="theme.js"></script>
<script>
  const $ = (id)=>document.getElementById(id);
  const msg = $('msg');
  function showMsg(t,type){ msg.textContent=t; msg.className='msg '+type; }
  function clearMsg(){ msg.className='msg'; msg.textContent=''; }

  const MIN_PW = 6;
  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function makeEye(btnId, inputId){
    $(btnId).onclick = ()=>{
      const p=$(inputId); const show=p.type==='password';
      p.type = show ? 'text':'password';
      $(btnId).textContent = show ? 'Sembunyikan':'Lihat';
    };
  }
  makeEye('eye','password');
  makeEye('eyeConfirm','confirm');

  function checkMatch(){
    const hint=$('confirmHint');
    const pw=$('password').value, cf=$('confirm').value;
    if(!cf){ hint.textContent=''; hint.className='hint'; return; }
    const same = pw===cf;
    hint.textContent = same ? 'Password cocok.' : 'Password belum sama.';
    hint.className = 'hint ' + (same ? 'good':'bad');
  }
  $('password').addEventListener('input', checkMatch);
  $('confirm').addEventListener('input', checkMatch);

  function tolakLink(pesan){
    $('subtitle').textContent = 'Link ini tidak bisa dipakai.';
    $('form').style.display = 'none';
    $('back').style.display = 'block';
    showMsg(pesan, 'err');
  }

  // Link dari email membawa token di fragment URL. supabase-js memungutnya
  // sendiri lalu membentuk sesi pemulihan; getSession() menunggu proses itu
  // selesai. Kalau fragment-nya membawa error (link kedaluwarsa atau sudah
  // terpakai), Supabase menaruh keterangannya di fragment yang sama.
  (async function siap(){
    const frag = new URLSearchParams(location.hash.replace(/^#/, ''));
    if(frag.get('error') || frag.get('error_code')){
      const d = frag.get('error_description') || '';
      return tolakLink(/expired/i.test(d)
        ? 'Link reset sudah kedaluwarsa. Minta link baru dari halaman Masuk.'
        : 'Link reset tidak berlaku. Minta link baru dari halaman Masuk.');
    }

    const { data } = await client.auth.getSession();
    if(!data.session){
      return tolakLink('Link reset tidak berlaku atau sudah terpakai. '
        + 'Minta link baru lewat "Lupa password?" di halaman Masuk.');
    }

    $('subtitle').textContent = 'Untuk ' + (data.session.user.email || 'akun kamu') + '.';
    $('form').style.display = 'block';
    // Bersihkan token dari URL supaya tidak ikut tersalin atau tersimpan di riwayat.
    history.replaceState(null, '', location.pathname);
  })();

  $('form').addEventListener('submit', async (e)=>{
    e.preventDefault(); clearMsg();
    const pw=$('password').value, cf=$('confirm').value;
    const btn=$('submitBtn');

    if(!pw) return showMsg('Password baru wajib diisi.','err');
    if(pw.length<MIN_PW) return showMsg('Password minimal '+MIN_PW+' karakter.','err');
    if(!cf) return showMsg('Konfirmasi password wajib diisi.','err');
    if(pw!==cf) return showMsg('Password dan konfirmasi password belum sama.','err');

    btn.disabled=true; btn.textContent='Menyimpan...';
    try{
      const { error } = await client.auth.updateUser({ password: pw });
      if(error) throw error;
      showMsg('Password berhasil diganti! Mengarahkan ke materi...','ok');
      setTimeout(()=> location.replace('home.html'), 900);
    }catch(err){
      const m = (err && err.message) ? err.message : 'Gagal menyimpan password.';
      if(/should be different|same as the old/i.test(m))
        showMsg('Password baru tidak boleh sama dengan yang lama.','err');
      else showMsg(m,'err');
      btn.disabled=false; btn.textContent='Simpan password baru';
    }
  });
</script>
</body>
</html>
